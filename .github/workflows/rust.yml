name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always


jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: dynamic-state
            features: "--features scnr2/dynamic-state,tests/dynamic-state,scnr2-python/dynamic-state"

    steps:
    - uses: actions/checkout@v4
    - name: Build (${{ matrix.name }})
      run: cargo build --no-default-features ${{ matrix.features }} --verbose
    - name: Run tests (${{ matrix.name }})
      run: cargo test --no-default-features ${{ matrix.features }} --verbose
